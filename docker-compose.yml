x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://aggregator:aggregator@postgres:5432/aggregator
  restart: unless-stopped

x-healthcheck: &app-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health')"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: aggregator
      POSTGRES_DB: aggregator
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Throwaway database for the DB tests; only started with `--profile test`, never by `up`.
  # The tests DROP all tables in it. Data lives in tmpfs and disappears when it stops.
  #   docker compose --profile test up -d postgres-test
  #   TEST_DATABASE_URL=postgresql+asyncpg://aggregator:aggregator@localhost:5433/aggregator_test
  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: aggregator
      POSTGRES_DB: aggregator_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator -d aggregator_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations once, so bot and indexer never race to run them.
  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Long-polls Telegram. Shares only the DB with the indexer.
  bot:
    <<: *app
    command: aggregator-bot
    healthcheck: *app-healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Telethon reader: backfills history, then listens for new/edited/deleted messages.
  # Needs the session created by `make telegram-login` in ./data.
  indexer:
    <<: *app
    command: aggregator-indexer
    volumes:
      - ./data:/app/data
    healthcheck: *app-healthcheck
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
